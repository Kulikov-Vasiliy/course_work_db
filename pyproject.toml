[project]
name = "postrgre-python"
version = "0.1.0"
description = "for course work"
authors = [
    { name = "Vasiliy" }
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "coverage (>=7.13.1,<8.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "psycopg2 (>=2.9.11,<3.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "requests (>=2.32.5,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.lints.dependencies]
flake8 = "^7.3.0"
mypy = "^1.19.1"
isort = "^7.0.0"


[tool.poetry.group.devtools.dependencies]
black = "^26.1.0"
pytest-cov = "^7.0.0"
requests-mock = "^1.12.1"


[tool.isort]
line_length = 119
profile = "black"


[tool.black]
line-length = 119
exclude = ".*\\.git.*"


[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = ".*\\venv.*"
